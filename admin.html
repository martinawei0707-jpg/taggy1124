<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>標籤小人｜製作團隊管理</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="./style.css"><body class="admin-page">
  <h1>製作團隊管理後台</h1>
  <p>Taggy v0.5.2 ｜企劃與製作：黃筱崴</p>
  <a href="index.html">返回遊戲</a>
  <p id="status" role="status"></p>
  <section id="login"><form id="loginform">
    <input id="email" type="email" placeholder="管理者電子郵件" required>
    <input id="password" type="password" placeholder="密碼" required>
    <button>登入</button></form></section>
    <div id="panel" hidden>
      <div class="tools">
        <button id="logout">登出</button>
        <label>起日 <input id="start" type="date"></label>
        <label>迄日 <input id="end" type="date"></label>
        <button id="today">今天</button>
        <button id="all">全部日期</button>
        <button id="refresh">查詢</button>

      </div>
      
      <section><h2>收集統計（台灣時間）</h2>
          <p id="summary"></p>
          <p>輸入次數不等於參與人數。統計依原始輸入文字計算。</p>
          
          <div class="tools">
            <button id="exportStats">匯出詞頻 CSV</button>
            <button id="exportEvents">匯出原始紀錄 CSV</button>
          </div>
          
          <div class="scroll" id="stats">
          </div>

      </section>
      
      <section>
          <h2>共用標籤庫（累計）</h2>
          <div class="tools">
            <input id="search" placeholder="搜尋標籤">
            <button id="exportLibrary">匯出標籤庫 CSV</button>
          </div>
          
          <div class="scroll" id="library">
          </div>
      </section><section>
          <h2>原始輸入紀錄</h2>
          <div class="scroll" id="events">
          </div>
      
      </section>
        
      <section>
          <h2>遊玩回饋</h2>
          <button id="exportFeedback">匯出回饋 CSV</button>
          <div class="scroll" id="feedback"></div>
      </section>
    </div><script src="./admin.js">

    </script>
    
  </body>
</html>
